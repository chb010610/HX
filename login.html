<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 宁波泓汛线缆有限公司内部管理系统</title>
<style>
/* ================= 全局 ================= */
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff6ff; --blue-glow:rgba(37,99,235,.35);
  --green:#16a34a; --green-l:#f0fdf4; --green-glow:rgba(22,163,74,.28);
  --orange:#ea580c; --orange-l:#fff7ed; --orange-glow:rgba(234,88,12,.28);
  --red:#dc2626; --red-l:#fef2f2; --red-glow:rgba(220,38,38,.28);
  --purple:#7c3aed; --purple-l:#f5f3ff; --purple-glow:rgba(124,58,237,.28);
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --border:#e2e8f0; --border2:#cbd5e1;
  --bg:#f1f5f9; --bg2:#f8fafc;
  --side:#0b1830; --side2:#111f3d; --side3:#1e3a6f;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(15,23,42,.07),0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 10px 30px rgba(2,8,23,.12),0 4px 12px rgba(2,8,23,.06);
  --transition:.2s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.5}
a{cursor:pointer;color:inherit}
h1,h2,h3{font-weight:600;letter-spacing:-.02em}

/* ================= 登录页 ================= */
.login-body{background:#070d1a;min-height:100vh;overflow:hidden}
.login-bg{
  position:relative;min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1200px 700px at 15% 20%,rgba(37,99,235,.28),transparent 65%),
    radial-gradient(900px 600px at 85% 80%,rgba(124,58,237,.22),transparent 60%),
    radial-gradient(700px 500px at 50% 110%,rgba(14,165,233,.18),transparent 55%),
    linear-gradient(135deg,#070d1a 0%,#0b1830 45%,#070d1a 100%);
}
.login-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.login-particles span{
  position:absolute;display:block;border-radius:50%;background:#fff;
  animation:floatUp linear infinite;filter:blur(.5px);
}
@keyframes floatUp{
  0%{transform:translateY(0) scale(1);opacity:0}
  10%{opacity:var(--o,.4)}
  90%{opacity:var(--o,.4)}
  100%{transform:translateY(-120vh) scale(.6);opacity:0}
}
.login-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.55;animation:pulseOrb 8s ease-in-out infinite}
.orb-1{width:360px;height:360px;background:rgba(37,99,235,.25);top:-80px;left:-80px;animation-delay:0s}
.orb-2{width:420px;height:420px;background:rgba(124,58,237,.2);bottom:-120px;right:-100px;animation-delay:-4s}
.orb-3{width:260px;height:260px;background:rgba(14,165,233,.18);top:40%;left:55%;animation-delay:-2s}
@keyframes pulseOrb{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.login-wrap-center{position:relative;width:100%;max-width:420px;z-index:10;animation:cardIn .7s cubic-bezier(.22,1,.36,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.login-card{
  position:relative;width:100%;padding:40px 34px 32px;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.55);
  border-radius:24px;
  box-shadow:0 32px 80px rgba(2,8,23,.55),0 0 0 1px rgba(255,255,255,.08) inset;
  backdrop-filter:blur(20px);
}
.login-card::before{
  content:"";position:absolute;inset:0;border-radius:24px;padding:1px;
  background:linear-gradient(135deg,rgba(59,130,246,.45),rgba(124,58,237,.35),rgba(14,165,233,.25));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}

.login-card-header{text-align:center;margin-bottom:28px;position:relative;z-index:1}
.brand-logo-ring{
  width:72px;height:72px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  box-shadow:0 10px 32px rgba(37,99,235,.45),0 0 0 6px rgba(59,130,246,.12);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.brand-logo-ring .brand-logo-img{
  width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;
}
.brand-logo-ring .brand-logo{
  width:54px;height:54px;border-radius:50%;background:#fff;color:#2563eb;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;
}
.login-system{font-size:22px;color:var(--text);margin-bottom:4px;letter-spacing:.5px}
.login-subtitle{font-size:13px;color:var(--text3);font-weight:500}

/* 登录页系统选择 */
.login-sys-select{display:flex;gap:10px;justify-content:center;margin-top:14px;position:relative;z-index:1}
.sys-option{flex:1;max-width:170px;cursor:pointer}
.sys-option input{position:absolute;opacity:0;pointer-events:none}
.sys-option span{
  display:block;text-align:center;padding:9px 10px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);
  font-size:13px;font-weight:600;letter-spacing:.5px;transition:var(--transition);user-select:none;
}
.sys-option:hover span{border-color:var(--blue);color:var(--blue)}
.sys-option input:checked + span{
  background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:#2563eb;color:#fff;
  box-shadow:0 4px 14px rgba(37,99,235,.35);
}
.login-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;color:var(--border2);font-size:12px}
.login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.login-divider span{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue-glow)}

.login-fields{position:relative;z-index:1;display:flex;flex-direction:column;gap:18px;margin-bottom:8px}
.field label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:7px;font-weight:600}
.input-icon{position:relative}
.input-icon .input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);width:18px;height:18px;pointer-events:none;transition:var(--transition)}
.input-icon input{
  width:100%;padding:13px 42px 13px 42px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;outline:none;transition:var(--transition);background:var(--bg2);color:var(--text);
}
.input-icon input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.input-icon:has(input:focus) .input-prefix{color:var(--blue)}
.input-icon input:not(:placeholder-shown){background:#fff}
.password-toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;border:none;background:transparent;
  color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.password-toggle:hover{background:var(--bg);color:var(--text2)}
.password-toggle svg{position:absolute;width:18px;height:18px;opacity:0;transition:var(--transition)}
.password-toggle:not(.show) .eye-open{opacity:1}
.password-toggle.show .eye-closed{opacity:1}

.field-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 20px;font-size:12.5px;position:relative;z-index:1}
.remember{color:var(--text2);display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.remember input{width:16px;height:16px;accent-color:var(--blue);border-radius:4px}
.forgot{color:var(--blue);text-decoration:none;font-weight:500;transition:var(--transition)}
.forgot:hover{color:var(--blue-d);text-decoration:underline}

.btn-login{
  position:relative;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;overflow:hidden;
  box-shadow:0 8px 24px rgba(37,99,235,.4);
  transition:var(--transition);letter-spacing:6px;position:relative;z-index:1;
}
.btn-login::before{
  content:"";position:absolute;inset:0;background:linear-gradient(135deg,#60a5fa,#3b82f6);
  opacity:0;transition:opacity .25s;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(37,99,235,.5)}
.btn-login:hover::before{opacity:1}
.btn-login span{position:relative;z-index:2}
.btn-login:active{transform:translateY(0)}
.btn-login.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.login-error{margin-top:14px;background:var(--red-l);color:var(--red);padding:11px;border-radius:var(--radius-sm);font-size:13px;text-align:center;border:1px solid #fecaca;animation:pop .25s ease}

.login-card-footer{margin-top:22px;text-align:center;font-size:11.5px;color:var(--text3);position:relative;z-index:1}

@media(max-width:520px){
  .login-card{padding:32px 22px 26px;border-radius:20px}
  .brand-logo-ring{width:64px;height:64px}
  .brand-logo-ring .brand-logo{width:46px;height:46px;font-size:22px}
  .login-system{font-size:20px}
}

/* ================= 布局 ================= */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);
  color:#e2e8f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  box-shadow:4px 0 24px rgba(2,8,23,.25);z-index:30;
}
.side-brand{display:flex;align-items:center;gap:12px;padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-logo{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0;
  box-shadow:0 6px 18px rgba(37,99,235,.4);
  object-fit:cover;overflow:hidden;
}
.side-title{color:#fff;font-weight:700;font-size:15.5px;letter-spacing:.3px}
.side-sub{font-size:11px;color:#7d90b5;margin-top:2px}
.side-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:5px;overflow:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--radius-sm);
  color:#94a3b8;cursor:pointer;font-size:14px;transition:var(--transition);text-decoration:none;font-weight:500;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;transition:var(--transition)}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.38);
}
.nav-item.active svg{color:#fff}
.side-foot{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.lock-tip{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#64748b;margin-bottom:12px}
.lock-tip svg{color:#16a34a}
.btn-logout{
  width:100%;padding:10px;background:rgba(255,255,255,.08);color:#e2e8f0;
  border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;
  transition:var(--transition);font-weight:500;
}
.btn-logout:hover{background:rgba(220,38,38,.22);border-color:rgba(220,38,38,.45);color:#fecaca}

.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{
  background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px rgba(15,23,42,.04);
}
.topbar h1{font-size:19px;color:var(--text)}
.top-sub{font-size:12px;color:var(--text3);margin-top:2px}
.top-user{display:flex;align-items:center;gap:13px}
.user-meta{text-align:right}
.user-name{font-weight:700;font-size:14px;color:var(--text)}
.user-role{font-size:12px;color:var(--text3);margin-top:1px;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.role-badge{display:inline-block;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.5px;box-shadow:0 2px 6px rgba(217,119,6,.3)}
.topbar-tools{display:flex;gap:10px;align-items:center}
.btn-tool{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:13px;border-radius:10px;background:#fff;border:1.5px solid var(--border);color:var(--text2);font-weight:600;transition:var(--transition)}
.btn-tool:hover{border-color:var(--blue);color:var(--blue-d);background:var(--blue-l);transform:translateY(-1px)}
.btn-tool-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.btn-tool-primary:hover{filter:brightness(1.06);color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 8px 20px rgba(37,99,235,.35)}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#7c3aed);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  box-shadow:0 4px 12px rgba(37,99,235,.3);
}
.content{padding:26px 30px;flex:1}

/* ================= 工作台 ================= */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-bottom:24px}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:22px 20px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);border:1px solid var(--border);transition:var(--transition);
}
.stat-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat-card.blue::before{background:linear-gradient(180deg,var(--blue),#60a5fa)}
.stat-card.green::before{background:linear-gradient(180deg,var(--green),#4ade80)}
.stat-card.orange::before{background:linear-gradient(180deg,var(--orange),#fb923c)}
.stat-card.red::before{background:linear-gradient(180deg,var(--red),#f87171)}
.stat-card.purple::before{background:linear-gradient(180deg,var(--purple),#a78bfa)}
.stat-num{font-size:32px;font-weight:800;margin-bottom:6px;color:var(--text);letter-spacing:-.02em}
.stat-label{font-size:13px;color:var(--text2);font-weight:500}
.stat-card::after{
  content:"";position:absolute;top:14px;right:16px;width:36px;height:36px;border-radius:50%;
  background:currentColor;opacity:.08;
}

.panel-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media(max-width:1100px){.panel-grid{grid-template-columns:1fr}}
.mini-logs{list-style:none;max-height:360px;overflow:auto;padding-right:4px}
.mini-logs li{padding:12px 6px;border-bottom:1px dashed var(--border);font-size:13px;transition:var(--transition)}
.mini-logs li:last-child{border-bottom:none}
.mini-logs li:hover{background:var(--bg2);border-radius:8px}
.mini-logs .l-time{color:var(--text3);font-size:11.5px;margin-bottom:3px}
.mini-logs .l-user{color:var(--blue-d);font-weight:700}
.mini-logs .l-act{
  display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:5px;
  padding:2px 8px;font-size:11.5px;margin:0 5px;font-weight:600;
}

/* ================= 面板 / 表格 ================= */
.panel{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px;
  border:1px solid rgba(226,232,240,.6);transition:var(--transition);
}
.panel:hover{box-shadow:var(--shadow-lg)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.panel-head h3{font-size:16px;color:var(--text)}
.badge-info{font-size:12px;color:var(--text2);background:var(--bg);padding:5px 12px;border-radius:20px;font-weight:500}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{
  background:#f8fafc;color:var(--text2);font-weight:700;text-align:left;padding:12px 14px;
  border-bottom:2px solid var(--border);white-space:nowrap;font-size:12.5px;letter-spacing:.2px;
}
.table td{padding:11px 14px;border-bottom:1px solid #eef2f7;vertical-align:middle;color:var(--text2)}
.table tbody tr{transition:var(--transition)}
.table tbody tr:hover{background:#f8fafc}
.table tbody tr:last-child td{border-bottom:none}
.table .code{font-family:Consolas,monospace;color:var(--blue-d);font-weight:700}
.row-obsolete td{color:var(--text3)}
.row-obsolete .code{text-decoration:line-through;color:var(--text3)}
.empty-row td{text-align:center;color:var(--text3);padding:32px}

/* 状态徽章 */
.badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-l);color:var(--green)}
.b-orange{background:var(--orange-l);color:var(--orange)}
.b-red{background:var(--red-l);color:var(--red)}
.b-gray{background:#f1f5f9;color:var(--text2)}
.b-blue{background:var(--blue-l);color:var(--blue-d)}
.b-purple{background:var(--purple-l);color:var(--purple)}

/* ================= 工具栏 ================= */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.filters input,.filters select{
  padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;
  outline:none;background:#fff;transition:var(--transition);min-width:160px;color:var(--text);
}
.filters input:focus,.filters select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.tool-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  padding:10px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;
  color:var(--text);font-size:13px;cursor:pointer;transition:var(--transition);font-weight:600;
}
.btn:hover{border-color:var(--border2);background:var(--bg2);transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent;color:#fff;
  box-shadow:0 6px 16px rgba(37,99,235,.25);
}
.btn-primary:hover{filter:brightness(1.06);box-shadow:0 8px 20px rgba(37,99,235,.35);transform:translateY(-1px)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11.5px;border-radius:6px;font-weight:600}

/* 附件单元格 */
.att-cell{display:flex;align-items:center;flex-wrap:wrap;gap:5px;max-width:280px}
.att-icon{font-size:14px;opacity:.7}
.att-name{color:var(--blue-d);font-weight:600;text-decoration:none;cursor:pointer;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-name:hover{text-decoration:underline}
.att-size{color:var(--text3);font-size:11.5px;font-weight:500}
.btn-danger{background:var(--red-l);border-color:#fecaca;color:var(--red)}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5}
.btn-success{background:var(--green-l);border-color:#bbf7d0;color:var(--green)}
.btn-success:hover{background:#dcfce7}
.btn-warn{background:var(--orange-l);border-color:#fed7aa;color:var(--orange)}
.btn-warn:hover{background:#ffedd5}
.link{color:var(--blue);font-size:13px;text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}

/* ================= 表单 ================= */
.issue-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
@media(max-width:1000px){.issue-grid{grid-template-columns:1fr}}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .field input,.form .field select{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:13.5px;outline:none;background:var(--bg2);transition:var(--transition);color:var(--text);
}
.form .field input:focus,.form .field select:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.form .field label{font-size:12.5px;color:var(--text2);margin-bottom:7px;font-weight:600;display:block}
.form-actions{display:flex;gap:12px;margin-top:8px}
.tips-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.tips-list li{
  background:linear-gradient(135deg,var(--blue-l),#fff);border:1px solid #dbeafe;border-radius:var(--radius-sm);
  padding:14px 16px;font-size:13px;color:#1e40af;line-height:1.65;transition:var(--transition);
}
.tips-list li:hover{transform:translateX(4px);box-shadow:0 4px 12px rgba(37,99,235,.1)}
.notice{
  background:linear-gradient(135deg,var(--orange-l),#fff);border:1px solid #fed7aa;border-radius:var(--radius-sm);
  padding:14px 18px;font-size:13px;color:#9a3412;line-height:1.7;margin-bottom:20px;
}

/* ================= 弹窗 / 提示 ================= */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.modal-mask[hidden]{display:none !important}
.toast[hidden]{display:none !important}
.modal{
  background:#fff;border-radius:var(--radius);padding:28px;width:100%;max-width:580px;
  box-shadow:0 28px 70px rgba(2,8,23,.35);max-height:90vh;overflow:auto;animation:pop .2s ease;
  border:1px solid var(--border);
}
.modal.wide{max-width:900px}
.att-manager-table{margin-top:12px}
.att-manager-table .att-file{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify:flex-start}
.att-meta{display:block;color:var(--text3);font-size:11.5px;margin-top:3px}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:17px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.modal-close{cursor:pointer;color:var(--text3);font-size:24px;line-height:1;border:none;background:none;transition:var(--transition)}
.modal-close:hover{color:var(--red);transform:rotate(90deg)}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:22px}
.modal .form-row{margin-bottom:0}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);color:#fff;padding:12px 24px;border-radius:var(--radius-sm);font-size:14px;z-index:200;box-shadow:0 16px 40px rgba(2,8,23,.35);animation:pop .2s ease;font-weight:500}
.toast.ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.toast.err{background:linear-gradient(135deg,#dc2626,#b91c1c)}

/* ================= 打印 ================= */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea{display:block;visibility:visible;position:absolute;left:0;top:0;width:100%}
  #printArea *{visibility:visible}
  .print-head{text-align:center;margin-bottom:18px}
  .print-head h1{font-size:20px;letter-spacing:2px}
  .print-head .sub{font-size:12px;color:#333;margin-top:4px}
  .print-meta{font-size:12px;color:#333;margin-bottom:10px;display:flex;justify-content:space-between}
  .print-table{width:100%;border-collapse:collapse;font-size:11px}
  .print-table th,.print-table td{border:1px solid #333;padding:5px 6px;text-align:left}
  .print-table th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-sign{margin-top:26px;font-size:12px;display:flex;gap:60px}
}

/* ================= 响应式 ================= */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:translateX(0)}
  .content{padding:20px}
}
</style>

<script>
/* ================= 数据层 =================
 * 宁波泓汛线缆有限公司 内部管理系统
 * 数据持久化于 localStorage；所有写操作必须调用 addLog 留痕。
 * 日志和受控文件记录没有删除接口；附件删除仅限管理员并自动留痕 —— 满足验厂要求。
 * ============================================ */

var DB_KEY='hx_db_v6';
var LEGACY_DB_KEYS=['hx_db_v5','hx_db_v4','hx_db_v3','hx_db_v2'];
var GH_OWNER='chb010610';
var GH_REPO='HX';
var GH_TOKEN='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';
var GH_PATH='data.json';
var GH_SHA='';

function githubPull(){
  var url='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH;
  fetch(url,{headers:{'Authorization':'Bearer '+GH_TOKEN,'Accept':'application/vnd.github+json'}})
    .then(function(r){
      if(r.status===404){console.log('[同步] 远程无数据，使用本地');return null;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(!data)return;
      GH_SHA=data.sha;
      try{
        var remote=JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
        localStorage.setItem(DB_KEY,JSON.stringify(remote));
        console.log('[同步] 已从 GitHub 拉取最新数据');
        if(typeof onSyncUpdate==='function')onSyncUpdate();
      }catch(e){console.error('[同步] 解析失败',e);}
    })
    .catch(function(e){console.error('[同步] 拉取失败',e);});
}

function githubPush(){
  var raw=localStorage.getItem(DB_KEY);
  if(!raw)return;
  try{
    var content=btoa(unescape(encodeURIComponent(raw)));
  }catch(e){console.error('[同步] 编码失败',e);return;}
  var url='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH;
  var body={message:'数据同步 '+nowStr(),content:content};
  if(GH_SHA)body.sha=GH_SHA;
  fetch(url,{
    method:'PUT',
    headers:{'Authorization':'Bearer '+GH_TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  })
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.content&&data.content.sha)GH_SHA=data.content.sha;
      console.log('[同步] 已推送到 GitHub');
    })
    .catch(function(e){console.error('[同步] 推送失败',e);});
}

function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function uid(prefix){
  return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}

function seedDB(){
  return {
    company:'宁波泓汛线缆有限公司',
    users:[
      {username:'陈海波',password:'123456',name:'陈海波',role:'管理员',dept:'信息中心'},
      {username:'wengkong',password:'123456',name:'王文控',role:'文控员',dept:'品质部'},
      {username:'cangku',password:'123456',name:'李仓管',role:'仓管员',dept:'仓储部'},
      {username:'shengchan',password:'123456',name:'张主管',role:'主管',dept:'生产部'}
    ],
    depts:['总经理办','品质部','生产部','技术部','仓储部','采购部','销售部','设备部','人事行政部'],
    // 正式使用前业务数据已清空：受控文件、附件、物料单据和业务日志均从空白开始录入
    docs:[],
    materials:[],
    logs:[]
  };
}

function getDB(){
  var raw=localStorage.getItem(DB_KEY);
  if(!raw){
    var db=seedDB();
    for(var i=0;i<LEGACY_DB_KEYS.length;i++){
      var legacy=localStorage.getItem(LEGACY_DB_KEYS[i]);
      if(legacy){
        try{
          var oldDB=JSON.parse(legacy);
          db.company=oldDB.company||db.company;
          db.depts=oldDB.depts||db.depts;
          if(oldDB.users&&oldDB.users.length){
            // 保留旧账号，但以种子数据中的管理员账号为准（避免旧管理员残留导致新账号无法登录）
            db.users=oldDB.users.filter(function(u){return u.role!=='管理员';});
            seedDB().users.forEach(function(u){
              if(u.role==='管理员')db.users.unshift(u);
            });
            if(!db.users.length)db.users=seedDB().users;
          }
        }catch(e){}
      }
      localStorage.removeItem(LEGACY_DB_KEYS[i]);
    }
    localStorage.setItem(DB_KEY,JSON.stringify(db));
    return db;
  }
  try{return JSON.parse(raw);}catch(e){
    var freshDB=seedDB();
    localStorage.setItem(DB_KEY,JSON.stringify(freshDB));
    return freshDB;
  }
}
function saveDB(db){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
  githubPush();
}

/* 操作留痕：所有增/改/审批动作必须调用 */
function addLog(action,detail){
  var db=getDB();
  var s=sessionStorage.getItem('hx_session');
  var user='未登录用户';
  if(s){
    try{
      var o=JSON.parse(s);
      user=o.name+'('+ (o.role||'') +')';
    }catch(e){}
  }
  db.logs.unshift({time:nowStr(),user:user,action:action,detail:detail});
  saveDB(db);
}

function currentUser(){
  var s=sessionStorage.getItem('hx_session');
  if(!s)return null;
  try{return JSON.parse(s);}catch(e){return null;}
}

githubPull();

</script>
<script>
function fillAccount(u,p){
  document.getElementById('username').value=u;
  document.getElementById('password').value=p;
  document.getElementById('password').type='password';
  updateEyeIcon();
}

var pwdInput=document.getElementById('password');
var toggleBtn=document.getElementById('togglePwd');
function updateEyeIcon(){
  var isText=pwdInput.type==='text';
  toggleBtn.classList.toggle('show',isText);
}
toggleBtn.addEventListener('click',function(){
  pwdInput.type=pwdInput.type==='password'?'text':'password';
  updateEyeIcon();
});

document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value;
  var btn=document.getElementById('loginBtn');
  var db=getDB();
  var user=db.users.find(function(x){return x.username===u&&x.password===p;});
  if(!user){
    document.getElementById('loginError').hidden=false;
    addLog('登录失败','用户 ['+u+'] 尝试登录失败');
    btn.classList.add('shake');
    setTimeout(function(){btn.classList.remove('shake');},500);
    return;
  }
  var sysTypeEl=document.querySelector('input[name="sysType"]:checked');
  var sysType=sysTypeEl?sysTypeEl.value:'生产管理系统';
  if(sysType!=='生产管理系统'){
    var errEl=document.getElementById('loginError');
    errEl.textContent=sysType+'尚未开发，敬请期待';
    errEl.hidden=false;
    btn.classList.add('shake');
    setTimeout(function(){btn.classList.remove('shake');},500);
    return;
  }
  sessionStorage.setItem('hx_session',JSON.stringify({username:user.username,name:user.name,role:user.role,dept:user.dept,sysType:sysType,loginAt:new Date().toISOString()}));
  addLog('登录','用户 ['+user.name+' / '+user.username+'] 登录'+sysType);
  location.href='index.html';
});

/* 动态粒子 */
(function(){
  var container=document.getElementById('particles');
  if(!container)return;
  var count=38;
  var html='';
  for(var i=0;i<count;i++){
    var size=Math.random()*3+1;
    var left=Math.random()*100;
    var top=Math.random()*100;
    var duration=Math.random()*20+12;
    var delay=Math.random()*duration;
    var opacity=Math.random()*0.5+0.2;
    html+='<span style="left:'+left+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px;opacity:'+opacity+';animation-duration:'+duration+'s;animation-delay:-'+delay+'s;"></span>';
  }
  container.innerHTML=html;
})();
</script>
